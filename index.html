<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FAF9FD" />
    <title>skymessanger 1.0.0</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL@20..48,400,0..1,0&family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Roboto', sans-serif;
        overflow: hidden;
      }

      #loader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        z-index: 9999;
        animation: fadeOut 0.5s ease-in-out 3.5s forwards;
      }

      .loader-content {
        text-align: center;
        color: white;
      }

      .loader-spinner {
        width: 60px;
        height: 60px;
        margin: 0 auto 20px;
        animation: spin 1s linear infinite;
      }

      .loader-spinner svg {
        width: 100%;
        height: 100%;
      }

      .loader-text {
        font-size: 24px;
        font-weight: 600;
        letter-spacing: 2px;
        animation: pulse 1.5s ease-in-out infinite;
      }

      .loader-subtext {
        font-size: 14px;
        margin-top: 10px;
        opacity: 0.8;
        animation: fadeInOut 2s ease-in-out 0.5s infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes pulse {
        0%, 100% {
          opacity: 1;
        }
        50% {
          opacity: 0.7;
        }
      }

      @keyframes fadeInOut {
        0%, 100% {
          opacity: 0.5;
        }
        50% {
          opacity: 1;
        }
      }

      @keyframes fadeOut {
        to {
          opacity: 0;
          visibility: hidden;
        }
      }

      #root {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="loader">
      <div class="loader-content">
        <div class="loader-spinner">
          <svg viewBox="0 0 50 50">
            <circle cx="25" cy="25" r="20" fill="none" stroke="white" stroke-width="3" stroke-dasharray="31.4 94.2"/>
          </svg>
        </div>
        <div class="loader-text">SkyMessanger</div>
        <div class="loader-subtext">Loading...</div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Redirect to gradleai.netlify.app after animation completes (3.5s)
      setTimeout(() => {
        window.location.href = 'https://gradleai.netlify.app';
      }, 3500);
    </script>
  </body>
</html>
