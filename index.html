<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FAF9FD" />
    <title>GradleAI - Loading</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
    <style>
      :root {
        --primary: #6366f1;
        --secondary: #a855f7;
        --accent: #ec4899;
        --dark: #0f172a;
        --darker: #020617;
        --text: #f8fafc;
        --text-dim: #cbd5e1;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html, body {
        width: 100%;
        height: 100%;
        background: var(--dark);
        color: var(--text);
      }

      body {
        font-family: 'Space Grotesk', sans-serif;
        overflow: hidden;
      }

      #loader-container {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, var(--darker) 0%, var(--dark) 50%, #1e293b 100%);
        z-index: 9999;
        opacity: 1;
        transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1);
      }

      #loader-container.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      /* Background animated orbs */
      .orb {
        position: absolute;
        border-radius: 50%;
        filter: blur(40px);
        opacity: 0.3;
      }

      .orb-1 {
        width: 300px;
        height: 300px;
        background: linear-gradient(135deg, var(--primary), var(--secondary));
        top: -100px;
        right: -100px;
        animation: float 8s ease-in-out infinite;
      }

      .orb-2 {
        width: 250px;
        height: 250px;
        background: linear-gradient(135deg, var(--secondary), var(--accent));
        bottom: -80px;
        left: -80px;
        animation: float 10s ease-in-out infinite 1s;
      }

      .orb-3 {
        width: 200px;
        height: 200px;
        background: linear-gradient(135deg, var(--accent), var(--primary));
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        animation: float 12s ease-in-out infinite 2s;
      }

      @keyframes float {
        0%, 100% { transform: translate(0, 0); }
        33% { transform: translate(30px, -30px); }
        66% { transform: translate(-20px, 20px); }
      }

      .loader-content {
        position: relative;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 32px;
        text-align: center;
      }

      /* Animated logo/circle */
      .loader-logo {
        width: 120px;
        height: 120px;
        position: relative;
        animation: pulse-scale 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }

      .logo-circle {
        position: absolute;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        border: 3px solid transparent;
        background: linear-gradient(135deg, var(--primary), var(--secondary), var(--accent)) border-box;
        -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        animation: rotate 3s linear infinite;
      }

      .logo-circle::before {
        content: "";
        position: absolute;
        inset: 8px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(99, 102, 241, 0.2), transparent);
        animation: pulse-inner 2s ease-in-out infinite;
      }

      .logo-inner {
        position: absolute;
        inset: 12px;
        border-radius: 50%;
        background: linear-gradient(135deg, rgba(168, 85, 247, 0.15), rgba(236, 72, 153, 0.15));
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 48px;
        font-weight: 700;
        background-clip: text;
        -webkit-background-clip: text;
        color: transparent;
        background-image: linear-gradient(135deg, var(--primary), var(--accent));
      }

      @keyframes rotate {
        to { transform: rotate(360deg); }
      }

      @keyframes pulse-scale {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.08); }
      }

      @keyframes pulse-inner {
        0%, 100% { opacity: 0.4; transform: scale(1); }
        50% { opacity: 0.1; transform: scale(1.2); }
      }

      /* Main text */
      .loader-text {
        font-size: clamp(32px, 6vw, 52px);
        font-weight: 700;
        letter-spacing: -0.02em;
        line-height: 1.2;
        background: linear-gradient(135deg, var(--text) 0%, var(--text-dim) 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        animation: fade-in-up 1s ease-out 0.2s both;
      }

      .loader-text span {
        display: inline-block;
        background: linear-gradient(135deg, var(--primary), var(--secondary), var(--accent));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      /* Subtext */
      .loader-subtext {
        font-family: 'JetBrains Mono', monospace;
        font-size: 13px;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        color: var(--text-dim);
        animation: fade-in-up 1s ease-out 0.4s both;
        max-width: 400px;
      }

      .loader-subtext a {
        color: var(--primary);
        text-decoration: none;
        font-weight: 600;
        transition: color 0.3s ease;
      }

      .loader-subtext a:hover {
        color: var(--accent);
      }

      /* Progress bar */
      .progress-bar {
        width: 200px;
        height: 3px;
        background: rgba(99, 102, 241, 0.2);
        border-radius: 2px;
        overflow: hidden;
        animation: fade-in-up 1s ease-out 0.6s both;
      }

      .progress-fill {
        height: 100%;
        background: linear-gradient(90deg, var(--primary), var(--secondary), var(--accent));
        width: 0%;
        animation: progress-load 3.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        box-shadow: 0 0 20px rgba(99, 102, 241, 0.5);
      }

      @keyframes progress-load {
        0% { width: 0%; }
        80% { width: 100%; }
        100% { width: 100%; }
      }

      /* Credits */
      .loader-credits {
        font-size: 11px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: rgba(148, 163, 184, 0.6);
        margin-top: 16px;
        animation: fade-in-up 1s ease-out 0.8s both;
        line-height: 1.6;
      }

      .loader-credits strong {
        color: rgba(148, 163, 184, 0.9);
        font-weight: 600;
      }

      /* Floating particles effect */
      .particles {
        position: absolute;
        width: 100%;
        height: 100%;
        inset: 0;
        pointer-events: none;
      }

      .particle {
        position: absolute;
        width: 2px;
        height: 2px;
        border-radius: 50%;
        background: var(--primary);
        opacity: 0;
      }

      @keyframes particle-float {
        0% {
          opacity: 1;
          transform: translateY(0) translateX(0);
        }
        100% {
          opacity: 0;
          transform: translateY(-100px) translateX(var(--tx));
        }
      }

      /* Animations */
      @keyframes fade-in-up {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      #root {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <!-- Particles background -->
    <div class="particles" id="particles"></div>

    <!-- Main loader -->
    <div id="loader-container" aria-live="polite" aria-label="Loading GradleAI">
      <!-- Animated background orbs -->
      <div class="orb orb-1"></div>
      <div class="orb orb-2"></div>
      <div class="orb orb-3"></div>

      <!-- Content -->
      <div class="loader-content">
        <!-- Animated logo -->
        <div class="loader-logo">
          <div class="logo-circle"></div>
          <div class="logo-inner">A</div>
        </div>

        <!-- Main text -->
        <div class="loader-text">
          <span>Gradle</span>AI
        </div>

        <!-- Subtext -->
        <div class="loader-subtext">
          Preparing your experience
        </div>

        <!-- Progress bar -->
        <div class="progress-bar">
          <div class="progress-fill"></div>
        </div>

        <!-- Credits -->
        <div class="loader-credits">
          <strong>GradleAI</strong> by <strong>biivva_</strong> & <strong>SEDA's Community</strong>
        </div>
      </div>
    </div>

    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Create floating particles
      function createParticles() {
        const particlesContainer = document.getElementById('particles');
        const particleCount = 30;

        for (let i = 0; i < particleCount; i++) {
          const particle = document.createElement('div');
          particle.className = 'particle';
          
          const x = Math.random() * window.innerWidth;
          const y = Math.random() * window.innerHeight;
          const tx = (Math.random() - 0.5) * 200;
          
          particle.style.left = x + 'px';
          particle.style.top = y + 'px';
          particle.style.setProperty('--tx', tx + 'px');
          particle.style.animation = `particle-float ${2 + Math.random() * 2}s ease-out infinite`;
          particle.style.animationDelay = Math.random() * 1 + 's';
          
          particlesContainer.appendChild(particle);
        }
      }

      createParticles();

      // Redirect after animation
      const loader = document.getElementById('loader-container');
      const redirectUrl = 'https://gradleai.netlify.app';

      setTimeout(() => {
        if (loader) {
          loader.classList.add('hidden');
        }
      }, 3000);

      setTimeout(() => {
        window.location.href = redirectUrl;
      }, 3800);
    </script>
  </body>
</html>
