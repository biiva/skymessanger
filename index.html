<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FAF9FD" />
    <title>skymessanger 1.0.0</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL@20..48,400,0..1,0&family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg1: #0f172a;
        --bg2: #1d4ed8;
        --bg3: #7c3aed;
        --text: #f8fafc;
        --accent: #a5b4fc;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html, body {
        width: 100%;
        height: 100%;
        background: var(--bg1);
      }

      body {
        font-family: 'Roboto', sans-serif;
        overflow: hidden;
      }

      #loader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, var(--bg1) 0%, var(--bg2) 30%, var(--bg3) 100%);
        z-index: 9999;
        opacity: 1;
        transition: opacity 0.6s ease, visibility 0.6s ease;
      }

      #loader.hidden {
        opacity: 0;
        visibility: hidden;
      }

      .loader-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        color: var(--text);
        text-align: center;
      }

      .loader-ring {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        background: conic-gradient(from 0deg, rgba(255,255,255,0.15), rgba(255,255,255,1), rgba(255,255,255,0.15));
        position: relative;
        animation: spin 1.1s linear infinite;
        box-shadow: 0 0 24px rgba(255,255,255,0.25);
      }

      .loader-ring::before {
        content: "";
        position: absolute;
        inset: 12px;
        border-radius: 50%;
        background: rgba(15, 23, 42, 0.7);
        border: 2px solid rgba(255,255,255,0.2);
      }

      .loader-text {
        font-size: clamp(26px, 4vw, 44px);
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        animation: pulse 1.6s ease-in-out infinite;
      }

      .loader-subtext {
        font-size: 14px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: rgba(255,255,255,0.75);
        animation: fadeText 2s ease-in-out infinite;
      }

      #root {
        width: 100%;
        height: 100%;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes pulse {
        0%, 100% {
          opacity: 1;
          transform: scale(1);
        }
        50% {
          opacity: 0.7;
          transform: scale(1.04);
        }
      }

      @keyframes fadeText {
        0%, 100% {
          opacity: 0.5;
        }
        50% {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div id="loader" aria-live="polite" aria-label="Loading">
      <div class="loader-content">
        <div class="loader-ring"></div>
        <div class="loader-text">SkyMessanger</div>
        <div class="loader-subtext">Loading...</div>
      </div>
    </div>

    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
    <script>
      const loader = document.getElementById('loader');
      const redirectUrl = 'https://gradleai.netlify.app';

      setTimeout(() => {
        if (loader) {
          loader.classList.add('hidden');
        }
      }, 2800);

      setTimeout(() => {
        window.location.href = redirectUrl;
      }, 3600);
    </script>
  </body>
</html>
